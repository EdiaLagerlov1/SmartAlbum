<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAlbum - Photo Album Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SmartAlbum</h1>
            <p>Transform your photos into a beautiful PDF album</p>
        </header>

        <main>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="albumName">Album Name:</label>
                    <input type="text" id="albumName" name="albumName" required
                           placeholder="Enter album name">
                </div>

                <div class="form-group">
                    <label for="images">Select Photos (JPG, PNG):</label>
                    <input type="file" id="images" name="images" multiple accept="image/jpeg,image/png,image/jpg" required>
                    <small>Max 50 images, 5MB each</small>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Generate Album</button>
            </form>

            <div id="statusMessage" class="status-message hidden"></div>

            <div id="progressContainer" class="progress-container hidden">
                <div class="progress-bar">
                    <div id="progressBar" class="progress"></div>
                </div>
                <p id="progressText">Uploading...</p>
            </div>

            <div id="downloadSection" class="download-section hidden">
                <h2>Your Album is Ready!</h2>
                <a id="downloadLink" href="#" class="btn-download">Download PDF</a>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 SmartAlbum. Powered by AWS.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
