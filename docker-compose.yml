version: '3.8'

services:
  upload-service:
    build:
      context: .
      dockerfile: upload-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=us-east-1
      - PDF_SERVICE_URL=http://pdf-service:8082
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - smartalbum-network

  pdf-service:
    build:
      context: .
      dockerfile: pdf-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - AWS_REGION=us-east-1
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - smartalbum-network

  download-service:
    build:
      context: .
      dockerfile: download-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - AWS_REGION=us-east-1
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - smartalbum-network

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - smartalbum-network

networks:
  smartalbum-network:
    driver: bridge
